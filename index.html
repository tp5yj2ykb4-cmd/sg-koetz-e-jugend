*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);background:var(--papier);color:var(--text);
  font-size:16px;line-height:1.45;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Kopf ---------- */
header{
  background:var(--nacht);color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 16px 0;
  position:sticky;top:0;z-index:40;
  box-shadow:0 2px 12px rgba(34,54,26,.20);
}
.brand{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.wappen{width:39px;height:40px;flex:none;background:var(--wappen) center/contain no-repeat}
.brand h1{
  margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px;
}
.brand span{font-size:12px;color:#AFC79B;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.ichbin{display:flex;align-items:center;gap:8px;margin:12px 0 10px;flex-wrap:wrap}
.ichbin>label{font-size:12px;color:#AFC79B;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who button{
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.20);color:#E2EDD9;
  border-radius:999px;padding:6px 13px;font-size:14px;font-weight:650;cursor:pointer;
}
.who button[aria-pressed="true"]{background:#fff;color:var(--nacht);border-color:#fff}
.tabs{display:flex;gap:2px;margin-top:2px}
.tabs button{
  flex:1;background:none;border:0;border-bottom:3px solid transparent;color:#AFC79B;
  padding:11px 4px 10px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.01em;
}
.tabs button[aria-pressed="true"]{color:#fff;border-bottom-color:#8FBF6A}

/* ---------- Nächstes Spiel ---------- */
.next{
  margin:14px 12px 0;background:linear-gradient(160deg,var(--nacht-2),#416832);
  color:#fff;border-radius:var(--radius);padding:14px 16px;
  position:relative;overflow:hidden;
}
.next::after{
  content:"";position:absolute;right:-16px;top:-10px;width:132px;height:136px;
  background:var(--wappen) center/contain no-repeat;opacity:.11;pointer-events:none;
}
.next>*{position:relative;z-index:1}
.next .kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#B7CFA4;font-weight:800}
.next .match{font-size:19px;font-weight:800;margin:5px 0 2px;letter-spacing:-.2px}
.next .when{font-size:14px;color:#D5E5C9}
.next .chips{margin-top:11px}

/* ---------- Liste ---------- */
main{padding:0 12px}
.monat{
  margin:22px 2px 8px;font-size:12px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;
}
.monat::after{content:"";flex:1;height:1px;background:var(--linie)}

.karte{
  background:var(--karte);border:1px solid var(--linie);border-radius:var(--radius);
  margin-bottom:9px;display:flex;overflow:hidden;position:relative;
}
.karte.vorbei{opacity:.5}
.karte.konflikt{border-color:#E5C489;box-shadow:inset 3px 0 0 var(--evtl)}
.tag{
  width:62px;flex:none;background:var(--papier);border-right:1px solid var(--linie);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 2px;
}
.tag .wd{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag .dd{font-size:25px;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.tag .mm{font-size:11px;color:var(--muted);font-weight:600}
.body{flex:1;min-width:0;padding:10px 12px 11px}
.zeile1{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.badge{font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:6px;color:#fff}
.badge.e1{background:var(--e1)}
.badge.e2{background:#fff;color:var(--e1);border:1.5px solid var(--e1);padding:1px 6px}
.badge.beide{background:linear-gradient(90deg,var(--e1) 50%,#89AF6B 50%)}
.badge.test{background:#6C7A66}
.zeit{font-weight:800;font-size:15px}
.ha{font-size:11px;font-weight:800;border:1px solid var(--linie);border-radius:6px;padding:1px 6px;color:var(--muted)}
.gegner{font-weight:700;font-size:16px;letter-spacing:-.2px;overflow-wrap:anywhere}
.ort{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.notiz{font-size:13px;color:#7C5D15;background:#FAF4E4;border-radius:8px;padding:4px 8px;margin-top:6px}
.chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.chip{
  border:1px solid var(--linie);background:#fff;border-radius:999px;
  padding:5px 11px 5px 8px;font-size:13px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;color:var(--muted);
}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#C6CDC1;flex:none}
.chip[data-s="ja"]{border-color:#BFD6AB;background:#EFF5E9;color:#3A5A2C}
.chip[data-s="ja"] .dot{background:var(--ja)}
.chip[data-s="nein"]{border-color:#EDC3BE;background:#FCF0EE;color:#8B271F}
.chip[data-s="nein"] .dot{background:var(--nein)}
.chip[data-s="vielleicht"]{border-color:#E8D2A2;background:#FBF5E6;color:#7E5F16}
.chip[data-s="vielleicht"] .dot{background:var(--evtl)}
.chip.ich{box-shadow:0 0 0 2px rgba(75,113,57,.28)}
.next .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26);color:#E4EFD9}
.next .chip[data-s="ja"]{background:rgba(255,255,255,.24);border-color:#BEDCA6;color:#F1F8EB}
.next .chip[data-s="nein"]{background:rgba(180,56,46,.42);border-color:#E79289;color:#FBE2E0}
.next .chip[data-s="vielleicht"]{background:rgba(192,132,25,.42);border-color:#E7C481;color:#FCEED4}
.warn{font-size:12px;font-weight:700;color:var(--nein);margin-left:auto;white-space:nowrap}
.edit{
  position:absolute;top:6px;right:6px;border:0;background:none;color:#AFB9A9;
  font-size:17px;line-height:1;padding:6px 8px;border-radius:8px;cursor:pointer;
}
.edit:hover{background:var(--papier);color:var(--text)}
.pick{
  width:24px;height:24px;border-radius:7px;border:2px solid #BAC5B2;background:#fff;
  position:absolute;top:9px;right:9px;cursor:pointer;padding:0;
}
.pick[aria-pressed="true"]{background:var(--blau);border-color:var(--blau)}
.pick[aria-pressed="true"]::after{content:"✓";color:#fff;font-size:14px;font-weight:800;display:block;line-height:20px}

.leer{text-align:center;color:var(--muted);padding:36px 20px 44px;font-size:15px}
@supports ((-webkit-mask-image:url("")) or (mask-image:url(""))){
  .leer::before{
    content:"";display:block;width:70px;height:72px;margin:0 auto 14px;
    background:var(--e1);opacity:.3;
    -webkit-mask:var(--wappen) center/contain no-repeat;mask:var(--wappen) center/contain no-repeat;
  }
}

/* ---------- Fußleiste ---------- */
.fuss{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--linie);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;
}
.fuss button{
  border:1px solid var(--linie);background:#fff;border-radius:11px;padding:10px 12px;
  font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;
}
.fuss button.primaer{background:var(--blau);border-color:var(--blau);color:#fff}
.fuss button[aria-pressed="true"]{background:var(--nacht);border-color:var(--nacht);color:#fff}
.fuss .spacer{flex:1}
.bulk{display:none;flex-direction:column;gap:8px;align-items:stretch}
.bulk.an{display:flex}
.bulk .zeile{display:flex;gap:6px}
.bulk .zeile button{flex:1;padding:11px 4px;font-size:14px}
.bulk .info{font-size:13px;color:var(--muted);font-weight:600}

/* ---------- Dialog ---------- */
dialog{
  border:0;border-radius:16px;padding:0;width:min(520px,94vw);
  box-shadow:0 24px 60px rgba(27,36,26,.35);color:var(--text);
}
dialog::backdrop{background:rgba(27,36,26,.55)}
.dlg-kopf{padding:16px 18px 10px;font-size:18px;font-weight:800;letter-spacing:-.2px}
.dlg-body{padding:0 18px 8px;max-height:66vh;overflow:auto}
.dlg-fuss{display:flex;gap:8px;padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--linie);margin-top:10px}
.dlg-fuss button{flex:1;border:1px solid var(--linie);background:#fff;border-radius:11px;padding:11px;font-weight:700;cursor:pointer}
.dlg-fuss button.primaer{background:var(--blau);border-color:var(--blau);color:#fff}
.dlg-fuss button.gefahr{background:#fff;border-color:#EDC3BE;color:var(--nein);flex:0 0 auto;padding:11px 14px}
label.feld{display:block;margin:11px 0}
label.feld>span{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input,select,textarea{
  width:100%;border:1px solid var(--linie);border-radius:10px;padding:10px 11px;background:#fff;
}
textarea{min-height:62px;resize:vertical}
.duo{display:flex;gap:10px}
.duo>*{flex:1}
.hinweis{font-size:13px;color:var(--muted);margin:6px 0 0}

/* ---------- Toast + Status ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));
  background:var(--nacht);color:#fff;padding:10px 16px;border-radius:11px;font-size:14px;font-weight:650;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .18s;max-width:92vw;text-align:center;
}
#toast.an{opacity:1}
.sync{font-size:11px;color:#AFC79B;font-weight:700;margin-left:auto}
.sync.fehler{color:#F2B3AA}
:focus-visible{outline:3px solid #7FA968;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="wappen" role="img" aria-label="Wappen SG Kötz"></div>
    <h1>SG Kötz · E-Jugend</h1>
    <span>Trainerplan 26/27</span>
    <span class="sync" id="sync">lokal</span>
  </div>
  <div class="ichbin">
    <label>Ich bin</label>
    <div class="who" id="who"></div>
  </div>
  <div class="tabs" id="tabs">
    <button data-team="alle" aria-pressed="true">Alle</button>
    <button data-team="E1" aria-pressed="false">E1</button>
    <button data-team="E2" aria-pressed="false">E2</button>
  </div>
</header>

<div id="next"></div>
<main id="liste"></main>

<div class="fuss" id="fussNormal">
  <button class="primaer" id="btnNeu">+ Termin</button>
  <button id="btnMulti" aria-pressed="false">Mehrfach</button>
  <div class="spacer"></div>
  <button id="btnVergangen">Vergangene</button>
  <button id="btnMenu" aria-label="Einstellungen">⋯</button>
</div>

<div class="fuss bulk" id="fussBulk">
  <div class="info" id="bulkInfo">0 Termine gewählt</div>
  <div class="zeile">
    <button data-set="ja">✓ Zusage</button>
    <button data-set="vielleicht">? Unklar</button>
    <button data-set="nein">✗ Absage</button>
  </div>
  <div class="zeile">
    <button id="bulkAlle">Alle sichtbaren</button>
    <button id="bulkEnde">Fertig</button>
  </div>
</div>

<dialog id="dlgTermin">
  <div class="dlg-kopf" id="dlgTitel">Termin</div>
  <div class="dlg-body">
    <div class="duo">
      <label class="feld"><span>Team</span>
        <select id="fTeam"><option>E1</option><option>E2</option><option value="E1+E2">E1 + E2</option></select>
      </label>
      <label class="feld"><span>Art</span>
        <select id="fTyp"><option>Liga</option><option>Test</option><option>Training</option><option>Turnier</option><option>Sonstiges</option></select>
      </label>
    </div>
    <div class="duo">
      <label class="feld"><span>Datum</span><input type="date" id="fDatum"></label>
      <label class="feld"><span>Uhrzeit</span><input type="time" id="fZeit"></label>
    </div>
    <label class="feld"><span>Gegner / Titel</span><input type="text" id="fGegner" placeholder="z. B. SC Bubesheim"></label>
    <div class="duo">
      <label class="feld"><span>Heim / Auswärts</span>
        <select id="fHa"><option value="H">Heim</option><option value="A">Auswärts</option><option value="?">offen</option></select>
      </label>
      <label class="feld"><span>Spielkennung</span><input type="text" id="fKennung" placeholder="optional"></label>
    </div>
    <label class="feld"><span>Spielstätte</span><input type="text" id="fOrt" placeholder="z. B. Waldsportanlage"></label>
    <label class="feld"><span>Notiz</span><textarea id="fNotiz" placeholder="Treffpunkt, Fahrdienst, offene Punkte …"></textarea></label>
  </div>
  <div class="dlg-fuss">
    <button class="gefahr" id="btnLoeschen">Löschen</button>
    <button id="btnAbbruch">Abbrechen</button>
    <button class="primaer" id="btnSpeichern">Speichern</button>
  </div>
</dialog>

<dialog id="dlgMenu">
  <div class="dlg-kopf">Einstellungen</div>
  <div class="dlg-body">
    <label class="feld"><span>Trainer 1</span><input type="text" id="n1" placeholder="Benni"></label>
    <label class="feld"><span>Trainer 2</span><input type="text" id="n2" placeholder="Alex"></label>
    <label class="feld"><span>Trainer 3</span><input type="text" id="n3" placeholder="Flo"></label>
    <label class="feld"><span>Google-Sheets-Adresse (Apps-Script-URL)</span>
      <input type="url" id="fApi" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <p class="hinweis">Ohne Adresse läuft die App nur auf diesem Gerät. Mit Adresse sehen alle drei Trainer dieselben Daten.</p>
    <div class="dlg-fuss" style="border:0;padding:6px 0 0">
      <button id="btnIcs">Kalender-Datei (.ics)</button>
      <button id="btnReload">Neu laden</button>
    </div>
  </div>
  <div class="dlg-fuss">
    <button id="btnMenuZu">Schließen</button>
    <button class="primaer" id="btnMenuSpeichern">Speichern</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
/* =====================================================================
   SG Kötz E-Jugend · Trainerplan
   Einzeldatei-App für GitHub Pages. Backend optional: Google Apps Script.
   ===================================================================== */

/* Hier die Web-App-URL des Apps-Script eintragen (oder in den Einstellungen). */
const API_URL_FEST = "";

/* ---------- Spieltermine aus Spielplan 313473 (E1) / 313945 (E2) ---------- */
const SEED = [
  {id:"t-0904-e1",typ:"Test",team:"E1",datum:"2026-09-04",zeit:"17:30",gegner:"TSV Thannhausen",ha:"H",ort:"Waldsportanlage Kleinkötz",kennung:"",sptg:"",notiz:""},
  {id:"t-0906-e2",typ:"Test",team:"E2",datum:"2026-09-06",zeit:"10:30",gegner:"Reisensburg",ha:"H",ort:"Waldsportanlage Kleinkötz",kennung:"",sptg:"",notiz:""},
  {id:"t-0913-e1",typ:"Test",team:"E1",datum:"2026-09-13",zeit:"10:00",gegner:"(SG) Kammeltal",ha:"?",ort:"noch offen",kennung:"",sptg:"",notiz:"Anstoß noch nicht bestätigt (10 oder 11 Uhr)"},
  {id:"t-0913-e2",typ:"Test",team:"E2",datum:"2026-09-13",zeit:"11:00",gegner:"(SG) Kammeltal",ha:"?",ort:"noch offen",kennung:"",sptg:"",notiz:"Anstoß noch nicht bestätigt (10 oder 11 Uhr)"},
  {id:"t-0916-e1",typ:"Test",team:"E1",datum:"2026-09-16",zeit:"18:00",gegner:"TSV 1924 Wasserburg",ha:"A",ort:"Wasserburg",kennung:"",sptg:"",notiz:""},

  {id:"313945004",typ:"Liga",team:"E2",datum:"2026-09-18",zeit:"17:00",gegner:"TSV 1924 Wasserburg 2",ha:"H",ort:"Waldsportanlage",kennung:"313945004",sptg:"1",notiz:""},
  {id:"313945006",typ:"Liga",team:"E2",datum:"2026-09-26",zeit:"13:45",gegner:"VfL 1898 Leipheim 2",ha:"A",ort:"VfL Leipheim Sportplatz",kennung:"313945006",sptg:"2",notiz:"Aushang nennt 12:00 Uhr, DFBnet 13:45 Uhr – bitte prüfen"},
  {id:"313945012",typ:"Liga",team:"E2",datum:"2026-10-02",zeit:"17:00",gegner:"VfR Jettingen II",ha:"H",ort:"Waldsportanlage",kennung:"313945012",sptg:"3",notiz:""},
  {id:"313945016",typ:"Liga",team:"E2",datum:"2026-10-09",zeit:"16:00",gegner:"(SG) SpVgg Ellzee 2 (5vs5) 3",ha:"A",ort:"Sportplatz Ellzee",kennung:"313945016",sptg:"4",notiz:""},
  {id:"313945020",typ:"Liga",team:"E2",datum:"2026-10-16",zeit:"17:00",gegner:"(SG) Kammeltal II",ha:"H",ort:"Waldsportanlage",kennung:"313945020",sptg:"5",notiz:""},
  {id:"313945022",typ:"Liga",team:"E2",datum:"2026-10-23",zeit:"16:00",gegner:"(SG) GV Eintracht Autenried II.",ha:"A",ort:"Sportanlage Hochwang – Kleinfeld",kennung:"313945022",sptg:"6",notiz:"Spieltag 7 (30./31.10.) ist die E2 spielfrei"},

  {id:"313473008",typ:"Liga",team:"E1",datum:"2026-09-27",zeit:"10:00",gegner:"(SG) Kammeltal I",ha:"H",ort:"Waldsportanlage",kennung:"313473008",sptg:"2",notiz:"Spieltag 1 (18.–20.09.) ist die E1 spielfrei"},
  {id:"313473010",typ:"Liga",team:"E1",datum:"2026-10-02",zeit:"17:30",gegner:"(SG) GV Eintracht Autenried I.",ha:"A",ort:"Sportanlage Hochwang – Kleinfeld",kennung:"313473010",sptg:"3",notiz:""},
  {id:"313473016",typ:"Liga",team:"E1",datum:"2026-10-11",zeit:"10:00",gegner:"SC Bubesheim",ha:"H",ort:"Waldsportanlage",kennung:"313473016",sptg:"4",notiz:""},
  {id:"313473019",typ:"Liga",team:"E1",datum:"2026-10-17",zeit:"11:00",gegner:"TSV 1924 Wasserburg",ha:"A",ort:"Schulsportplatz Wasserburg",kennung:"313473019",sptg:"5",notiz:""},
  {id:"313473024",typ:"Liga",team:"E1",datum:"2026-10-25",zeit:"10:00",gegner:"VfL 1898 Leipheim",ha:"H",ort:"Waldsportanlage",kennung:"313473024",sptg:"6",notiz:""},
  {id:"313473025",typ:"Liga",team:"E1",datum:"2026-10-31",zeit:"13:45",gegner:"FC Günzburg",ha:"A",ort:"Auwaldstadion Kleinfeld",kennung:"313473025",sptg:"7",notiz:""}
];

/* ---------- Speicher (fällt auf RAM zurück, falls gesperrt) ---------- */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};

const S = {
  termine: [],
  status: {},                       // {terminId:{trainerId:"ja"|"nein"|"vielleicht"}}
  trainer: [{id:"T1",name:"Benni"},{id:"T2",name:"Alex"},{id:"T3",name:"Flo"}],
  ich: store.get("ich") || "T1",
  team: "alle",
  vergangen: false,
  multi: false,
  wahl: new Set(),
  api: store.get("api") || API_URL_FEST,
  offline: false
};

const $ = s => document.querySelector(s);
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function d(t){ return new Date(t.datum + "T" + (t.zeit||"00:00") + ":00"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("an"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("an"),2200); }
function name(id){ const t=S.trainer.find(x=>x.id===id); return t?t.name:id; }

/* ---------- Sync ---------- */
function syncAnzeige(txt,fehler){ const el=$("#sync"); el.textContent=txt; el.classList.toggle("fehler",!!fehler); }

async function laden(){
  if(!S.api){ lokalLaden(); syncAnzeige("nur dieses Gerät"); render(); return; }
  syncAnzeige("lädt …");
  try{
    const r = await fetch(S.api + "?action=load&t=" + Date.now());
    const j = await r.json();
    uebernehmen(j);
    S.offline = false;
    syncAnzeige("synchron");
  }catch(e){
    S.offline = true;
    lokalLaden();
    syncAnzeige("offline – lokal", true);
  }
  render();
}

function uebernehmen(j){
  S.termine = (j.termine && j.termine.length) ? j.termine : SEED.slice();
  S.status  = j.status || {};
  if(j.trainer && j.trainer.length===3) S.trainer = j.trainer;
  lokalSichern();
}

function lokalLaden(){
  try{
    const roh = store.get("daten");
    if(roh){ const j=JSON.parse(roh); S.termine=j.termine||SEED.slice(); S.status=j.status||{}; if(j.trainer) S.trainer=j.trainer; return; }
  }catch(e){}
  S.termine = SEED.slice(); S.status = {};
}
function lokalSichern(){ store.set("daten", JSON.stringify({termine:S.termine,status:S.status,trainer:S.trainer})); }

async function senden(payload){
  lokalSichern();
  if(!S.api) return;
  try{
    const r = await fetch(S.api, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
      redirect:"follow"
    });
    const j = await r.json();
    if(j.ok){ uebernehmen(j); S.offline=false; syncAnzeige("synchron"); render(); }
    else { syncAnzeige("Fehler", true); toast("Google Sheets meldet: " + (j.error||"unbekannt")); }
  }catch(e){
    S.offline = true;
    syncAnzeige("nicht gespeichert", true);
    toast("Keine Verbindung – Änderung liegt nur auf diesem Gerät.");
  }
}

/* ---------- Auswertung ---------- */
function sichtbar(){
  const heute = new Date(); heute.setHours(0,0,0,0);
  return S.termine
    .filter(t => S.team==="alle" || t.team===S.team || t.team==="E1+E2")
    .filter(t => S.vergangen ? true : d(t) >= new Date(heute.getTime()-1))
    .sort((a,b)=> d(a)-d(b));
}
function st(tid,trid){ return (S.status[tid]||{})[trid] || ""; }
function anzahlJa(tid){ return S.trainer.filter(t=>st(tid,t.id)==="ja").length; }

/* Zwei Termine kollidieren, wenn sie am selben Tag weniger als 2 h auseinander liegen. */
function konflikte(){
  const k = new Set(), l = S.termine.slice().sort((a,b)=>d(a)-d(b));
  for(let i=0;i<l.length;i++) for(let j=i+1;j<l.length;j++){
    if(l[i].datum!==l[j].datum) break;
    if(l[i].team===l[j].team) continue;
    if((l[i].ort||"") === (l[j].ort||"")) continue;   // gleicher Platz = nacheinander machbar
    if(Math.abs(d(l[i])-d(l[j])) < 2*3600*1000){ k.add(l[i].id); k.add(l[j].id); }
  }
  return k;
}

/* ---------- Rendern ---------- */
function chipsHtml(t, dunkel){
  return S.trainer.map(tr=>{
    const s = st(t.id,tr.id);
    return `<button class="chip${tr.id===S.ich?" ich":""}" data-s="${s}" data-t="${t.id}" data-tr="${tr.id}"
      ><span class="dot"></span>${esc(tr.name)}</button>`;
  }).join("") + (anzahlJa(t.id)===0 && !dunkel ? `<span class="warn">niemand zugesagt</span>` : "");
}

function render(){
  // Trainer-Umschalter
  $("#who").innerHTML = S.trainer.map(t=>
    `<button data-tr="${t.id}" aria-pressed="${t.id===S.ich}">${esc(t.name)}</button>`).join("");

  const liste = sichtbar(), konf = konflikte();

  // Nächstes Spiel
  const jetzt = new Date();
  const n = S.termine.filter(t=>S.team==="alle"||t.team===S.team||t.team==="E1+E2").filter(t=>d(t)>=jetzt).sort((a,b)=>d(a)-d(b))[0];
  $("#next").innerHTML = n ? `<div class="next">
      <div class="kicker">Nächster Termin · ${tageBis(n)}</div>
      <div class="match">${n.ha==="A"?"bei ":"gegen "}${esc(n.gegner)}</div>
      <div class="when">${WD[d(n).getDay()]}, ${dm(n)} · ${esc(n.zeit)} Uhr · ${esc(n.team)} · ${esc(n.ort||"Ort offen")}</div>
      <div class="chips">${chipsHtml(n,true)}</div>
    </div>` : "";

  // Liste
  let html = "", monat = "";
  for(const t of liste){
    const dt = d(t), m = MON[dt.getMonth()] + " " + dt.getFullYear();
    if(m!==monat){ monat=m; html += `<div class="monat">${m}</div>`; }
    const vorbei = dt < new Date(new Date().setHours(0,0,0,0));
    const badge = t.team==="E1+E2" ? "beide" : (t.team==="E2"?"e2":"e1");
    html += `<article class="karte${vorbei?" vorbei":""}${konf.has(t.id)?" konflikt":""}">
      <div class="tag"><span class="wd">${WD[dt.getDay()]}</span><span class="dd tnum">${String(dt.getDate()).padStart(2,"0")}</span><span class="mm">${String(dt.getMonth()+1).padStart(2,"0")}.</span></div>
      <div class="body">
        <div class="zeile1">
          <span class="badge ${badge}">${esc(t.team)}</span>
          ${t.typ!=="Liga"?`<span class="badge test">${esc(t.typ)}</span>`:""}
          <span class="zeit tnum">${esc(t.zeit)}</span>
          <span class="ha">${t.ha==="A"?"auswärts":t.ha==="H"?"heim":"offen"}</span>
          ${t.sptg?`<span class="ort">· ${esc(t.sptg)}. Spieltag</span>`:""}
        </div>
        <div class="gegner">${esc(t.gegner)}</div>
        <div class="ort">${esc(t.ort||"Spielstätte offen")}</div>
        ${t.notiz?`<div class="notiz">${esc(t.notiz)}</div>`:""}
        ${konf.has(t.id)?`<div class="notiz">Zeitgleich mit dem anderen Team – ihr müsst euch aufteilen.</div>`:""}
        <div class="chips">${chipsHtml(t)}</div>
      </div>
      ${S.multi
        ? `<button class="pick" data-pick="${t.id}" aria-pressed="${S.wahl.has(t.id)}" aria-label="auswählen"></button>`
        : `<button class="edit" data-edit="${t.id}" aria-label="bearbeiten">✎</button>`}
    </article>`;
  }
  $("#liste").innerHTML = html || `<div class="leer">Keine Termine in dieser Ansicht.<br>Mit „+ Termin“ ergänzt ihr einen neuen.</div>`;

  $("#bulkInfo").textContent = S.wahl.size===1 ? "1 Termin gewählt" : S.wahl.size + " Termine gewählt";
  $("#btnVergangen").textContent = S.vergangen ? "Nur kommende" : "Vergangene";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.team===S.team));
}

function dm(t){ const x=d(t); return String(x.getDate()).padStart(2,"0")+"."+String(x.getMonth()+1).padStart(2,"0")+"."; }
function tageBis(t){
  const a=new Date(); a.setHours(0,0,0,0);
  const b=d(t); b.setHours(0,0,0,0);
  const n=Math.round((b-a)/86400000);
  return n===0?"heute":n===1?"morgen":"in "+n+" Tagen";
}

/* ---------- Bedienung ---------- */
document.addEventListener("click", e=>{
  const chip = e.target.closest(".chip");
  if(chip){ zyklus(chip.dataset.t, chip.dataset.tr); return; }

  const who = e.target.closest("#who button");
  if(who){ S.ich = who.dataset.tr; store.set("ich",S.ich); render(); return; }

  const tab = e.target.closest("#tabs button");
  if(tab){ S.team = tab.dataset.team; render(); return; }

  const ed = e.target.closest("[data-edit]");
  if(ed){ dialogOeffnen(ed.dataset.edit); return; }

  const pk = e.target.closest("[data-pick]");
  if(pk){ const id=pk.dataset.pick; S.wahl.has(id)?S.wahl.delete(id):S.wahl.add(id); render(); return; }

  const bset = e.target.closest("#fussBulk [data-set]");
  if(bset){ bulkSetzen(bset.dataset.set); return; }
});

function zyklus(tid,trid){
  const reihe = ["","ja","nein","vielleicht"];
  const neu = reihe[(reihe.indexOf(st(tid,trid))+1) % 4];
  S.status[tid] = S.status[tid] || {};
  if(neu) S.status[tid][trid] = neu; else delete S.status[tid][trid];
  render();
  senden({action:"status", eintraege:[{terminId:tid, trainerId:trid, status:neu}]});
}

function bulkSetzen(wert){
  if(!S.wahl.size){ toast("Erst Termine antippen."); return; }
  const eintraege = [];
  S.wahl.forEach(tid=>{
    S.status[tid] = S.status[tid] || {};
    if(wert) S.status[tid][S.ich] = wert; else delete S.status[tid][S.ich];
    eintraege.push({terminId:tid, trainerId:S.ich, status:wert});
  });
  const n = S.wahl.size;
  S.wahl.clear(); render();
  senden({action:"status", eintraege});
  toast(n + (n===1?" Termin":" Termine") + " gesetzt für " + name(S.ich));
}

$("#btnMulti").onclick = ()=>{ multiModus(!S.multi); };
$("#bulkEnde").onclick = ()=>{ multiModus(false); };
$("#bulkAlle").onclick = ()=>{ sichtbar().forEach(t=>S.wahl.add(t.id)); render(); };
function multiModus(an){
  S.multi = an; S.wahl.clear();
  $("#fussNormal").style.display = an ? "none" : "flex";
  $("#fussBulk").classList.toggle("an", an);
  $("#btnMulti").setAttribute("aria-pressed", an);
  if(an) toast("Termine antippen, dann unten Status setzen – gilt für " + name(S.ich));
  render();
}
$("#btnVergangen").onclick = ()=>{ S.vergangen=!S.vergangen; render(); };

/* ---------- Termin-Dialog ---------- */
let bearbeitet = null;
function dialogOeffnen(id){
  bearbeitet = id ? S.termine.find(t=>t.id===id) : null;
  const t = bearbeitet || {team:(S.team==="alle"?"E1":S.team),typ:"Liga",datum:"",zeit:"",gegner:"",ha:"H",ort:"",kennung:"",notiz:""};
  $("#dlgTitel").textContent = bearbeitet ? "Termin ändern" : "Neuer Termin";
  $("#fTeam").value=t.team; $("#fTyp").value=t.typ; $("#fDatum").value=t.datum; $("#fZeit").value=t.zeit;
  $("#fGegner").value=t.gegner; $("#fHa").value=t.ha||"H"; $("#fOrt").value=t.ort||"";
  $("#fKennung").value=t.kennung||""; $("#fNotiz").value=t.notiz||"";
  $("#btnLoeschen").style.display = bearbeitet ? "block" : "none";
  $("#dlgTermin").showModal();
}
$("#btnNeu").onclick = ()=>dialogOeffnen(null);
$("#btnAbbruch").onclick = ()=>$("#dlgTermin").close();
$("#btnSpeichern").onclick = ()=>{
  const datum=$("#fDatum").value, gegner=$("#fGegner").value.trim();
  if(!datum || !gegner){ toast("Datum und Gegner fehlen noch."); return; }
  const t = {
    id: bearbeitet ? bearbeitet.id : "x" + Date.now().toString(36),
    typ:$("#fTyp").value, team:$("#fTeam").value, datum, zeit:$("#fZeit").value||"00:00",
    gegner, ha:$("#fHa").value, ort:$("#fOrt").value.trim(), kennung:$("#fKennung").value.trim(),
    sptg: bearbeitet ? (bearbeitet.sptg||"") : "", notiz:$("#fNotiz").value.trim()
  };
  const i = S.termine.findIndex(x=>x.id===t.id);
  if(i>=0) S.termine[i]=t; else S.termine.push(t);
  $("#dlgTermin").close(); render();
  senden({action:"termin", termin:t});
  toast(i>=0 ? "Termin geändert" : "Termin ergänzt");
};
$("#btnLoeschen").onclick = ()=>{
  if(!bearbeitet) return;
  if(!confirm("Termin „" + bearbeitet.gegner + "“ für alle löschen?")) return;
  const id = bearbeitet.id;
  S.termine = S.termine.filter(t=>t.id!==id); delete S.status[id];
  $("#dlgTermin").close(); render();
  senden({action:"terminLoeschen", id});
  toast("Termin gelöscht");
};

/* ---------- Einstellungen ---------- */
$("#btnMenu").onclick = ()=>{
  $("#n1").value=S.trainer[0].name; $("#n2").value=S.trainer[1].name; $("#n3").value=S.trainer[2].name;
  $("#fApi").value=S.api||"";
  $("#dlgMenu").showModal();
};
$("#btnMenuZu").onclick = ()=>$("#dlgMenu").close();
$("#btnReload").onclick = ()=>{ $("#dlgMenu").close(); laden(); };
$("#btnMenuSpeichern").onclick = ()=>{
  S.trainer = [
    {id:"T1",name:$("#n1").value.trim()||"Benni"},
    {id:"T2",name:$("#n2").value.trim()||"Alex"},
    {id:"T3",name:$("#n3").value.trim()||"Flo"}
  ];
  const neu = $("#fApi").value.trim();
  const gewechselt = neu !== S.api;
  S.api = neu; store.set("api", S.api);
  $("#dlgMenu").close();
  senden({action:"trainer", trainer:S.trainer});
  render();
  if(gewechselt) laden();
  toast("Gespeichert");
};

/* ---------- Kalender-Export ---------- */
$("#btnIcs").onclick = ()=>{
  const p = n => String(n).padStart(2,"0");
  const fmt = dt => dt.getUTCFullYear()+p(dt.getUTCMonth()+1)+p(dt.getUTCDate())+"T"+p(dt.getUTCHours())+p(dt.getUTCMinutes())+"00Z";
  const zeilen = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SG Koetz//Trainerplan//DE","CALSCALE:GREGORIAN"];
  sichtbar().forEach(t=>{
    const a = d(t), b = new Date(a.getTime()+90*60000);
    zeilen.push("BEGIN:VEVENT","UID:"+t.id+"@sgkoetz","DTSTAMP:"+fmt(new Date()),
      "DTSTART:"+fmt(a),"DTEND:"+fmt(b),
      "SUMMARY:"+t.team+" "+(t.ha==="A"?"bei ":"gegen ")+t.gegner,
      "LOCATION:"+(t.ort||""), "DESCRIPTION:"+(t.typ+(t.notiz?" – "+t.notiz:"")),
      "END:VEVENT");
  });
  zeilen.push("END:VCALENDAR");
  const url = URL.createObjectURL(new Blob([zeilen.join("\r\n")],{type:"text/calendar;charset=utf-8"}));
  const a = document.createElement("a"); a.href=url; a.download="sg-koetz-e-jugend.ics"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
};

/* ---------- Start ---------- */
laden();
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && S.api) laden(); });
setInterval(()=>{ if(!document.hidden && S.api && !S.multi) laden(); }, 60000);
</script>
